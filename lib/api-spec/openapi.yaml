openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/me:
    get:
      operationId: getIdentity
      summary: Identidade verificada e vínculos da própria pessoa
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identidade validada com Supabase Auth e dados filtrados por RLS
          content:
            application/json:
              schema:
                type: object
                required: [user, memberships, isPlatformAdministrator]
                properties:
                  user:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                  memberships:
                    type: array
                    items:
                      type: object
                      description: Vínculo próprio, instituição e papéis; não concede acesso de negócio nesta entrega
                  isPlatformAdministrator:
                    type: boolean
        "401":
          description: Sessão ausente, inválida ou anônima
        "503":
          description: Configuração ou serviço de identidade indisponível
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

