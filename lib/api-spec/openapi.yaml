openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/institutions:
    get:
      operationId: listPlatformInstitutions
      summary: Lista instituições para superadministrador sem exigir vínculo institucional
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Instituições visíveis à administração da plataforma}
        "401": {description: Sessão inválida}
        "403": {description: Privilégio de plataforma ausente ou revogado}
    post:
      operationId: createPlatformInstitution
      summary: Cria instituição e auditoria atomicamente
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
      responses:
        "201": {description: Instituição criada}
        "400": {description: Entrada inválida}
        "401": {description: Sessão inválida}
        "403": {description: Privilégio de plataforma ausente ou revogado}
  /admin/institutions/{id}:
    patch:
      operationId: setPlatformInstitutionStatus
      summary: Suspende ou ativa instituição com auditoria atômica
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [active, suspended]}
      responses:
        "200": {description: Instituição atualizada}
        "400": {description: Entrada inválida}
        "401": {description: Sessão inválida}
        "403": {description: Privilégio de plataforma ausente ou revogado}
        "404": {description: Instituição inexistente}
  /auth/me:
    get:
      operationId: getIdentity
      summary: Identidade verificada e vínculos da própria pessoa
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identidade validada com Supabase Auth e dados filtrados por RLS
          content:
            application/json:
              schema:
                type: object
                required: [user, memberships, isPlatformAdministrator]
                properties:
                  user:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                  memberships:
                    type: array
                    items:
                      type: object
                      description: Vínculo próprio, instituição e papéis; não concede acesso de negócio nesta entrega
                  isPlatformAdministrator:
                    type: boolean
        "401":
          description: Sessão ausente, inválida ou anônima
        "503":
          description: Configuração ou serviço de identidade indisponível
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

