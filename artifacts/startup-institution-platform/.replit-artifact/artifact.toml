kind = "web"
previewPath = "/"
title = "Plataforma de Gestão e Avaliação"
description = "Protótipo navegável para instituições de ensino, incubadoras e programas de inovação gerenciarem startups, equipes, bancas, avaliações e resultados com experiências demonstrativas para seis perfis."
version = "1.0.0"
id = "artifacts/startup-institution-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23884

[services.development]
run = "pnpm --filter @workspace/startup-institution-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/startup-institution-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/startup-institution-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23884"
BASE_PATH = "/"
